<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>מבוא למדעי המחשב - שאלון סיכום</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#eaf5ff; --muted:#9fc2db; --midnight:#071727; --blue:#2c82ff; --teal:#18d0bd; --lime:#e5ff55; --coral:#ff7a6d; --line:rgba(184,222,246,.22); --card:rgba(12,39,61,.9); --radius:10px; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background-color:var(--midnight); background-image:radial-gradient(circle at 12% 12%,rgba(24,208,189,.22),transparent 26rem),radial-gradient(circle at 89% 7%,rgba(44,130,255,.26),transparent 30rem),linear-gradient(125deg,#071727,#0d2940 52%,#081c2e); font-family:Heebo,sans-serif; }
    body::before { position:fixed; inset:0; z-index:-1; content:""; opacity:.24; background-image:linear-gradient(rgba(229,255,85,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(229,255,85,.15) 1px,transparent 1px); background-size:34px 34px; mask-image:linear-gradient(to bottom,black,transparent 85%); }
    button, input { font:inherit; }
    .shell { width:min(760px, calc(100% - 32px)); margin:0 auto; padding:32px 0 48px; }
    .brand { display:flex; align-items:center; gap:10px; font-family:'JetBrains Mono',monospace; color:var(--lime); font-weight:700; direction:ltr; text-shadow:0 0 14px rgba(229,255,85,.7); }
    .brand i { display:block; width:12px; height:12px; background:var(--lime); border:2px solid var(--ink); box-shadow:0 0 13px var(--lime); }
    .panel { position:relative; overflow:hidden; margin-top:26px; padding:clamp(24px,6vw,48px); background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 20px 60px rgba(0,0,0,.34); backdrop-filter:blur(14px); animation:enter .4s ease both; }
    .panel::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(115deg,rgba(255,255,255,.07),transparent 32%); }
    h1,h2,p { margin-top:0; } h1 { font-size:clamp(32px,8vw,54px); line-height:1.06; letter-spacing:-.02em; margin-bottom:12px; } h2 { font-size:clamp(24px,5vw,34px); line-height:1.18; letter-spacing:-.01em; }
    .eyebrow { color:var(--teal); font-weight:800; font-size:14px; letter-spacing:.04em; margin-bottom:8px; }
    .meta { color:#b9d4e8; font-weight:600; }.cover-grid { display:grid; grid-template-columns:1.15fr .85fr; align-items:center; gap:24px; }.cover-art { width:100%; max-width:290px; justify-self:center; filter:drop-shadow(0 15px 22px rgba(0,0,0,.3)); }.chip-row { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 6px; direction:ltr; }.chip { padding:5px 9px; border:1px solid rgba(229,255,85,.4); border-radius:3px; color:var(--lime); background:rgba(229,255,85,.08); font:700 12px 'JetBrains Mono',monospace; }
    .name-wrap { margin:28px 0 20px; }
    label { display:block; margin-bottom:8px; font-weight:700; }
    input { width:100%; padding:14px 16px; border:2px solid var(--line); border-radius:6px; color:var(--ink); background:rgba(3,18,31,.75); outline:none; transition:border-color .18s,box-shadow .18s; }
    input::placeholder { color:#6d90ab; }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(44,130,255,.28); }
    .start, .next, .reset { position:relative; z-index:1; border:0; min-height:50px; padding:12px 26px; border-radius:6px; cursor:pointer; color:#062033; background:var(--lime); box-shadow:0 0 24px rgba(229,255,85,.22); font-weight:800; transition:transform .15s,box-shadow .15s,background .15s; }
    .start:hover:not(:disabled),.next:hover:not(:disabled),.reset:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(229,255,85,.36); }
    .start:active:not(:disabled),.next:active:not(:disabled),.reset:active { transform:translateY(0); }
    .start:focus-visible,.next:focus-visible,.reset:focus-visible,.nav-button:focus-visible,.choice:focus-visible,select:focus-visible { outline:3px solid var(--blue); outline-offset:3px; }
    .start:disabled { cursor:not-allowed; opacity:.4; transform:none; box-shadow:none; }
    .hidden { display:none !important; }
    .nowrap { white-space:nowrap; }
    .progress-copy { display:flex; justify-content:space-between; gap:12px; font-weight:700; font-size:14px; color:var(--muted); }
    .progress-copy #points { color:var(--lime); font-family:'JetBrains Mono',monospace; }
    .track { height:10px; overflow:hidden; margin:10px 0 30px; border:1px solid var(--line); border-radius:999px; background:#061827; }
    .fill { width:0; height:100%; background:repeating-linear-gradient(45deg,var(--lime),var(--lime) 10px,var(--teal) 10px,var(--teal) 20px); transition:width .45s ease; }
    .question { animation:enter .35s ease both; }.question-heading { display:flex; align-items:center; gap:13px; }.question-icon { flex:0 0 42px; display:grid; place-items:center; width:42px; height:42px; color:var(--lime); border:1px solid rgba(229,255,85,.45); border-radius:50%; background:rgba(229,255,85,.09); }.question-icon svg { width:23px; height:23px; }.question p { font-size:clamp(20px,4vw,25px); font-weight:700; line-height:1.42; }
    pre { margin:18px 0; padding:16px; overflow:auto; direction:ltr; text-align:left; color:#e9f7ff; background:var(--midnight); border-radius:4px; font:500 14px/1.6 'JetBrains Mono',monospace; } pre code { display:block; } .code-line { display:grid; grid-template-columns:2.4em max-content; gap:14px; min-width:max-content; } .line-number { color:#5e89a8; text-align:right; user-select:none; }
    .choices { display:grid; gap:11px; } .choice { position:relative; width:100%; padding:15px 17px; padding-left:46px; text-align:right; color:var(--ink); background:rgba(6,27,45,.72); border:2px solid var(--line); border-radius:8px; cursor:pointer; font-weight:600; line-height:1.5; transition:border-color .16s,background .16s,transform .16s; }
    .choice.code-choice { direction:ltr; text-align:left; padding-left:46px; padding-right:17px; color:#dff8ff; background:#061827; font:500 14px/1.7 'JetBrains Mono',monospace; }.choice.code-choice bdi { display:block; direction:ltr; unicode-bidi:isolate; }
    .choice:hover:not(:disabled) { border-color:var(--blue); background:rgba(44,130,255,.16); transform:translateX(-3px); }
    .choice:disabled { cursor:default; opacity:.75; }
    .choice.correct,.choice.wrong { opacity:1; }
    .choice.correct { border-color:var(--teal); background:rgba(24,208,189,.16); animation:pop .3s ease; }
    .choice.wrong { border-color:var(--coral); background:rgba(255,122,109,.16); animation:shake .35s; }
    .choice.correct::after,.choice.wrong::after { position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:19px; font-weight:800; }
    .choice.correct::after { content:"\2713"; color:var(--teal); } .choice.wrong::after { content:"\2715"; color:var(--coral); }
    .feedback { margin-top:22px; padding:17px 19px; border-right:5px solid var(--teal); border-radius:0 8px 8px 0; background:rgba(24,208,189,.12); line-height:1.6; animation:enter .28s ease; } .feedback.bad { border-color:var(--coral); background:rgba(255,122,109,.12); }
    .feedback strong { display:block; margin-bottom:5px; font-size:17px; color:var(--teal); } .feedback.bad strong { color:var(--coral); }
    .navigation { display:flex; justify-content:space-between; gap:12px; margin-top:26px; padding-top:22px; border-top:1px solid var(--line); }.nav-button { min-height:46px; padding:10px 18px; color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:6px; cursor:pointer; font-weight:700; transition:color .15s,border-color .15s,background .15s; }.nav-button:hover:not(:disabled) { color:var(--ink); border-color:var(--blue); background:rgba(44,130,255,.1); }.nav-button:disabled { opacity:.3; cursor:not-allowed; }
    .match-list { display:grid; gap:11px; } .match { display:grid; grid-template-columns:1fr auto; align-items:center; gap:12px; padding:14px 16px; background:rgba(6,27,45,.72); border:2px solid var(--line); border-radius:8px; font-weight:600; }
    select { padding:9px 11px; border:1px solid var(--line); border-radius:6px; color:var(--ink); background:var(--midnight); font:inherit; cursor:pointer; } select:disabled { opacity:.8; }
    .check-match { margin-top:18px; min-height:46px; padding:10px 22px; color:var(--teal); background:transparent; border:2px solid var(--teal); border-radius:6px; box-shadow:none; font-weight:800; }
    .check-match:hover:not(:disabled) { color:#062033; background:var(--teal); transform:translateY(-2px); box-shadow:0 8px 22px rgba(24,208,189,.3); }
    .result { text-align:center; }.trophy { width:86px; height:86px; margin:0 auto 12px; color:var(--lime); filter:drop-shadow(0 0 12px rgba(229,255,85,.35)); }.score { margin:24px auto; display:grid; place-items:center; width:150px; height:150px; border:8px solid var(--teal); border-radius:50%; background:radial-gradient(circle,#123a55,#071727); box-shadow:0 0 0 8px rgba(24,208,189,.12),0 0 35px rgba(24,208,189,.26); font-size:42px; font-weight:800; animation:pop .5s ease; }
    .score.fail { border-color:var(--coral); box-shadow:0 0 0 8px rgba(255,122,109,.12),0 0 35px rgba(255,122,109,.26); }
    .submit-note { margin:26px 0; padding:18px; color:#fff2b3; background:rgba(209,156,0,.15); border:2px dashed #d7ba47; border-radius:8px; text-align:right; line-height:1.6; }
    .confetti { position:fixed; inset:0; pointer-events:none; overflow:hidden; } .confetti span { position:absolute; top:-16px; width:11px; height:16px; background:var(--coral); animation:fall 2.8s linear forwards; }
    @keyframes enter { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } } @keyframes shake { 25%{transform:translateX(7px)} 50%{transform:translateX(-7px)} 75%{transform:translateX(3px)} } @keyframes pop { 50%{transform:scale(1.022)} } @keyframes fall { to { transform:translateY(110vh) rotate(540deg); } }
    @media (max-width:600px) { .cover-grid { grid-template-columns:1fr; }.cover-art { order:-1; max-width:210px; } .shell { padding:20px 0 36px; } .navigation { gap:10px; } .nav-button,.next { flex:1; } .score { width:132px; height:132px; font-size:36px; } .choice { padding:14px 15px; padding-left:42px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.001ms !important; transition-duration:.001ms !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><i></i> CS/START</div>
    <section id="cover" class="panel">
      <div class="cover-grid"><div><p class="eyebrow">מדעי המחשב</p><h1>מבוא למדעי המחשב</h1><p class="meta">רוני רובן · ספטמבר 2026 · תשפ&quot;ז</p><div class="chip-row"><span class="chip">CPU</span><span class="chip">RAM</span><span class="chip">JAVA</span></div></div><svg class="cover-art" viewBox="0 0 300 240" aria-label="איור מחשב עם מסך קוד" role="img"><path fill="#0a2339" stroke="#bde6ff" stroke-width="3" d="M39 27h185a12 12 0 0 1 12 12v116a12 12 0 0 1-12 12H39a12 12 0 0 1-12-12V39a12 12 0 0 1 12-12Z"/><rect x="40" y="40" width="183" height="103" rx="5" fill="#061827"/><path stroke="#18d0bd" stroke-width="7" stroke-linecap="round" d="m63 71 15 12-15 12m32 0h42m-74 25h27m10 0h73"/><path fill="#bde6ff" d="M117 167h30l8 22h-46z"/><rect x="87" y="189" width="100" height="10" rx="5" fill="#18d0bd"/><rect x="47" y="208" width="162" height="23" rx="5" fill="#163b58" stroke="#bde6ff" stroke-width="2"/><g fill="#e5ff55"><rect x="58" y="214" width="13" height="5" rx="2"/><rect x="77" y="214" width="13" height="5" rx="2"/><rect x="96" y="214" width="13" height="5" rx="2"/><rect x="115" y="214" width="13" height="5" rx="2"/><rect x="134" y="214" width="13" height="5" rx="2"/><rect x="153" y="214" width="13" height="5" rx="2"/><rect x="172" y="214" width="24" height="5" rx="2"/></g><rect x="224" y="7" width="63" height="45" rx="7" fill="#e5ff55"/><text x="255" y="36" text-anchor="middle" fill="#071727" font-family="monospace" font-size="14" font-weight="700">JAVA</text><circle cx="31" cy="166" r="24" fill="#ff7a6d"/><path fill="none" stroke="#071727" stroke-width="4" stroke-linecap="round" d="M22 166h18m-9-9v18"/></svg></div>
      <div class="name-wrap"><label for="studentName">שם התלמיד/ה</label><input id="studentName" autocomplete="name" placeholder="הקלידו את שמכם"></div>
      <button id="start" class="start" disabled>התחל</button>
    </section>
    <section id="quiz" class="panel hidden" aria-live="polite">
      <div class="progress-copy"><span id="count"></span><span id="points"></span></div><div class="track"><div id="fill" class="fill"></div></div>
      <div id="question"></div>
      <div id="navigation"></div>
    </section>
    <section id="results" class="panel result hidden"></section>
  </main>
  <div id="confetti" class="confetti hidden"></div>
  <script>
    const questions = [
      {type:'single',q:'מהו רכיב חומרה?',choices:['תוכנה שמפעילה את המחשב','חלק פיזי שאפשר לראות ולגעת בו','קובץ שנשמר בזיכרון','הוראה בשפת Java'],answer:1,why:'חומרה היא המרכיבים הפיזיים של מערכת המחשב. למשל, מקלדת, מסך ומעבד הם חומרה.'},
      {type:'single',q:'איזו מהאפשרויות היא תוכנה?',choices:['מקלדת','מסך','מערכת הפעלה','מדפסת'],answer:2,why:'תוכנה היא אוסף הוראות ותוכניות הפועלות במחשב. מערכת הפעלה מנהלת את פעולת המחשב ולכן היא תוכנה.'},
      {type:'single',q:'מה תפקידו של אמצעי קלט?',choices:['להציג מידע למשתמש','להכניס נתונים או פקודות למחשב','לשמור קבצים לאורך זמן','לבצע חישובים בלבד'],answer:1,why:'אמצעי קלט מעבירים מידע אל המחשב. מקלדת, עכבר ומיקרופון הם דוגמאות נפוצות.'},
      {type:'single',q:'איזה צירוף מתאים?',choices:['מקלדת: פלט; מסך: קלט','עכבר: פלט; מדפסת: קלט','מיקרופון: קלט; רמקולים: פלט','מסך מגע: פלט בלבד; מצלמה: פלט בלבד'],answer:2,why:'המיקרופון מכניס צליל למחשב ולכן הוא קלט. הרמקולים מוציאים צליל מהמחשב ולכן הם פלט.'},
      {type:'truefalse',q:'שפת מכונה מורכבת מהוראות בינאריות שהמעבד יכול לבצע ישירות.',answer:true,why:'שפת מכונה כתובה בביטים, כלומר 0 ו-1. המעבד מבין הוראות אלה ישירות.'},
      {type:'single',q:'מהו יתרון מרכזי של שפה עילית, כגון Java, על פני שפת מכונה?',choices:['היא נכתבת רק באמצעות 0 ו-1','היא קלה יותר לקריאה ולכתיבה עבור בני אדם','היא אינה זקוקה לתרגום לפני הרצה','היא יכולה לפעול רק במחשב אחד'],answer:1,why:'שפה עילית קרובה יותר לשפה האנושית ולדרך החשיבה של מתכנתים. לפני הרצה יש לתרגם אותה לשפה שהמחשב מבין.'},
      {type:'classify',q:'סווגו כל פריט לקטגוריה הנכונה.',categories:['חומרה','תוכנה'],items:[['עכבר','חומרה'],['דפדפן אינטרנט','תוכנה'],['זיכרון RAM','חומרה'],['משחק מחשב','תוכנה']],why:'עכבר ו-RAM הם רכיבים פיזיים ולכן חומרה. דפדפן ומשחק הם תוכניות ולכן תוכנה.'},
      {type:'single',q:'מהו אלגוריתם?',choices:['רכיב פיזי בתוך המחשב','סדרת הוראות ברורה לפתרון בעיה או לביצוע משימה','תוכנה להגנה מפני וירוסים','שפת מחשב המורכבת רק מ-0 ו-1'],answer:1,why:'אלגוריתם הוא סדר פעולות מסודר. אפשר לכתוב אלגוריתם גם בלי מחשב, למשל כהוראות להכנת כריך.'},
      {type:'code',q:'מה יודפס כאשר מפעילים את התוכנית?',code:'public class Main {\n    public static void main(String[] args) {\n        System.out.println("B");\n        System.out.println("A");\n    }\n}',choices:['B ואחריו A, בשתי שורות','A ואחריו B, בשתי שורות','רק B','הכול בשורה אחת: BA'],answer:0,why:'ההוראות בתוך main מתבצעות לפי הסדר שבו הן כתובות, מלמעלה למטה. הפעולה println מדפיסה ויורדת שורה, ולכן כל מילה תופיע בשורה נפרדת לפי סדר הכתיבה.'},
      {type:'code',q:'איזו שורה מגדירה את נקודת הכניסה הראשית של תוכנית Java?',code:'import java.util.*;\npublic class Main {\n    public static void main(String[] args) {\n        System.out.println("שלום");\n    }\n}',choices:['שורה 1','שורה 2','שורה 3','שורה 4'],answer:2,why:'הפעולה main היא המקום שממנו מתחילה ריצת התוכנית, והיא מוגדרת בשורה 3. שורה 1 היא ייבוא, שורה 2 מגדירה את המחלקה, ושורה 4 היא הוראת הדפסה שבתוך main.'},
      {type:'code',q:'השלימו את הקוד כך שיודפס Hello.',code:'System.out.println(_____);',choices:['"Hello"','Hello',"'Hello'",'print Hello'],answer:0,why:'מחרוזת טקסט ב-Java נכתבת בתוך מרכאות כפולות. לכן יש להדפיס את "Hello".'},
      {type:'single',q:'איזה סדר נכון מתאר את מבנה התוכנית?',choices:['main מכיל את המחלקה','המחלקה הראשית מכילה את הפעולה main, ו-main מכילה הוראות לביצוע','System.out.println מכיל את main','כל תוכנית Java אינה זקוקה למחלקה'],answer:1,why:'ב-Java ההוראות נמצאות בתוך פעולות, והפעולות בתוך מחלקות. בתוכנית בסיסית, main נמצאת במחלקה הראשית.'},
      {type:'code',q:'באיזו שורה נמצאת השגיאה, ומהי?',code:'public class Main {\n    public static void main(String[] args) {\n        System.out.println("שלום")\n    }\n}',choices:['שורה 3 — חסרה נקודה-פסיק בסוף השורה','שורה 3 — חסרות מרכאות סביב הטקסט','שורה 1 — חסר שם למחלקה','אין שגיאה בקוד'],answer:0,why:'ב-Java רוב ההוראות מסתיימות בנקודה-פסיק. בשורה 3 ההוראה מסתיימת בסוגר עגול בלבד, ולכן יש להוסיף נקודה-פסיק בסופה.'},
      {type:'code',q:'מה השגיאה בקוד?',code:'public class Main (\n    public static void main(String[] args) {\n        System.out.println("שלום");\n    }\n)',choices:['שורות 1 ו-5 — גוף המחלקה נפתח ונסגר בסוגריים עגולים במקום מסולסלים','שורה 1 — חסרה נקודה-פסיק בסוף השורה','שורה 2 — המילה הראשונה מיותרת','שורה 3 — חסרות מרכאות סביב הטקסט'],answer:0,why:'גוף של מחלקה נתחם תמיד בסוגריים מסולסלים. בשורות 1 ו-5 נעשה שימוש בסוגריים עגולים, שתפקידם אחר — למשל רשימת פרמטרים של פעולה.'},
      {type:'code',q:'מה השגיאה בקוד?',code:'public class Main {\n    public static void main(String[] args) {\n        System.out.println("שלום");\n}',choices:['אחרי שורה 4 — חסר סוגר מסולסל שסוגר את המחלקה','שורה 2 — חסרה נקודה-פסיק בסוף השורה','שורה 3 — חסרות מרכאות סביב הטקסט','אין שגיאה בקוד'],answer:0,why:'כל סוגר מסולסל שנפתח חייב סוגר תואם שסוגר אותו. שורה 4 סוגרת את הפעולה הראשית, אך המחלקה שנפתחה בשורה 1 נותרה פתוחה, ולכן חסר סוגר נוסף בסוף.'},
      {type:'code',q:'מה השגיאה בקוד?',code:'public class Main {\n    public static void main(String[] args) {\n        System.out.println(שלום);\n    }\n}',choices:['שורה 3 — הטקסט חייב להופיע בתוך מרכאות כפולות','שורה 3 — חסרה נקודה-פסיק בסוף השורה','אחרי שורה 5 — חסר סוגר מסולסל','אין שגיאה בקוד'],answer:0,why:'טקסט הוא מחרוזת, ומחרוזת נכתבת תמיד בתוך מרכאות כפולות. בלי המרכאות בשורה 3 השפה תנסה לפרש את המילה כשם של משתנה שלא הוגדר.'},
      {type:'code',q:'מה השגיאה בקוד?',code:'public class Main {\n    public static void main(String[] args) {\n        System.out.println("שלום");\n    }',choices:['אחרי שורה 4 — חסר סוגר מסולסל שסוגר את המחלקה','שורה 3 — חסרה נקודה-פסיק בסוף השורה','שורה 2 — אין פעולה ראשית','אין שגיאה בקוד'],answer:0,why:'שורה 1 פתחה את המחלקה ושורה 2 פתחה את הפעולה הראשית, כלומר נפתחו שני סוגריים מסולסלים. שורה 4 סוגרת רק אחד מהם, ולכן חסר סוגר נוסף בסוף הקוד.'},
      {type:'code',q:'מה השגיאה בקוד?',code:'public static void main(String[] args) {\n    System.out.println("שלום");\n}',choices:['לפני שורה 1 — חסרה הצהרה על מחלקה שתכיל את הפעולה','שורה 2 — חסרה נקודה-פסיק בסוף השורה','שורה 2 — חסרות מרכאות סביב הטקסט','אין שגיאה בקוד'],answer:0,why:'בשפה הזו פעולה אינה יכולה לעמוד בפני עצמה, אלא חייבת להיות בתוך מחלקה. הקוד מתחיל ישירות בהגדרת הפעולה הראשית, ולכן חסרה סביבו הצהרת מחלקה.'},
      {type:'code',q:'מה חסר בקוד?',code:'public class Main {\n    System.out.println("שלום");\n}',choices:['סביב שורה 2 — חסרה הפעולה הראשית שתכיל את ההוראה','שורה 1 — חסרה הצהרה על מחלקה','שורה 2 — חסרות מרכאות סביב הטקסט','אין שגיאה בקוד'],answer:0,why:'הוראה אינה יכולה לשבת ישירות בתוך מחלקה, אלא חייבת להיות בתוך פעולה. שורה 2 נמצאת בתוך המחלקה בלבד, ולכן חסרה סביבה הפעולה הראשית שממנה מתחילה ריצת התוכנית.'},

    ];
    const PASS = 60;
    const state = { index:0, score:0, order:[], responses:[], started:0 };
    const cover = document.querySelector('#cover'), quiz = document.querySelector('#quiz'), results = document.querySelector('#results'), questionEl = document.querySelector('#question');
    const nameInput = document.querySelector('#studentName'), startButton = document.querySelector('#start');
    nameInput.addEventListener('input', () => startButton.disabled = !nameInput.value.trim());
    startButton.addEventListener('click', startQuiz);
    function shuffle(items) { const list = [...items]; for (let index = list.length - 1; index > 0; index--) { const pick = Math.floor(Math.random() * (index + 1)); [list[index], list[pick]] = [list[pick], list[index]]; } return list; }
    function startQuiz() { state.order = shuffle(questions).map(item => ({ ...item, layout: item.type === 'truefalse' ? [{text:'אמת',correct:item.answer},{text:'שקר',correct:!item.answer}] : item.choices ? shuffle(item.choices.map((text,index) => ({text,correct:index === item.answer}))) : null })); state.index = 0; state.score = 0; state.responses = []; state.started = Date.now(); cover.classList.add('hidden'); quiz.classList.remove('hidden'); renderQuestion(); }
    function renderQuestion() {
      const item = state.order[state.index], response = state.responses[state.index]; document.querySelector('#count').textContent = `שאלה ${state.index + 1} מתוך ${state.order.length}`; document.querySelector('#points').textContent = `${state.score} נכונות`; document.querySelector('#fill').style.width = `${state.responses.filter(Boolean).length / state.order.length * 100}%`;
      questionEl.innerHTML = `<article class="question"><div class="question-heading"><span class="question-icon">${questionIcon(item.type)}</span><p>${item.q}</p></div>${item.code ? `<pre><code>${formatCode(item.code)}</code></pre>` : ''}<div class="choices"></div></article>`;
      if (item.type === 'classify') renderClassify(item, response); else renderChoices(item, response); renderNavigation();
    }
    function renderChoices(item, response) { const choices = item.layout; const list = questionEl.querySelector('.choices'); choices.forEach((choice,position) => { const button = document.createElement('button'); const isCode = item.type === 'code' && /(?:public |static |System\.|import |println|String\[\]|^print\b)/.test(choice.text); button.className = `choice${isCode ? ' code-choice' : ''}`; button.innerHTML = isCode ? `<bdi>${escapeHtml(choice.text)}</bdi>` : escapeHtml(choice.text); if (response) { button.disabled = true; if (choice.correct) button.classList.add('correct'); if (position === response.position && !response.correct) button.classList.add('wrong'); } else button.addEventListener('click', () => answerChoice(choice.correct, button, item, position)); list.append(button); }); if (response) appendFeedback(response.correct, item); }
    function renderClassify(item, response) { const article = questionEl.querySelector('.question'); article.querySelector('.choices').remove(); const list = document.createElement('div'); list.className = 'match-list'; item.items.forEach(([text,answer],index) => { const row = document.createElement('div'); row.className = 'match'; row.innerHTML = `<span>${text}</span><select data-answer="${answer}" aria-label="סיווג ${text}"><option value="">בחרו</option>${item.categories.map(category => `<option>${category}</option>`).join('')}</select>`; if (response) { const select = row.querySelector('select'); select.value = response.selections[index]; select.disabled = true; } list.append(row); }); const button = document.createElement('button'); button.className = 'start check-match'; button.textContent = 'בדיקה'; if (response) { button.remove(); article.append(list); appendFeedback(response.correct, item); } else { button.addEventListener('click', () => { const selects = [...list.querySelectorAll('select')]; if (selects.some(select => !select.value)) return; const correct = selects.every(select => select.value === select.dataset.answer); state.responses[state.index] = { correct, selections:selects.map(select => select.value) }; if (correct) state.score++; selects.forEach(select => select.disabled = true); button.remove(); appendFeedback(correct,item); }); article.append(list,button); } }
    function answerChoice(correct, selected, item, position) { questionEl.querySelectorAll('.choice').forEach((button,index) => { button.disabled = true; if (item.layout[index].correct) button.classList.add('correct'); }); if (!correct) selected.classList.add('wrong'); state.responses[state.index] = { correct, position }; if (correct) state.score++; appendFeedback(correct,item); }
    function appendFeedback(correct,item) { const feedback = document.createElement('div'); feedback.className = `feedback ${correct ? '' : 'bad'}`; feedback.innerHTML = `<strong>${correct ? 'נכון!' : 'לא בדיוק.'}</strong><span>${item.why}</span>`; questionEl.append(feedback); document.querySelector('#points').textContent = `${state.score} נכונות`; document.querySelector('#fill').style.width = `${state.responses.filter(Boolean).length / state.order.length * 100}%`; renderNavigation(); }
    function renderNavigation() { const navigation = document.querySelector('#navigation'); navigation.innerHTML = ''; navigation.className = 'navigation'; const previous = document.createElement('button'); previous.className = 'nav-button'; previous.textContent = 'הקודמת'; previous.disabled = state.index === 0; previous.addEventListener('click', () => { state.index--; renderQuestion(); }); const next = document.createElement('button'); next.className = 'next'; next.textContent = state.index === state.order.length - 1 ? 'לסיכום' : 'הבאה'; next.disabled = !state.responses[state.index]; next.addEventListener('click', nextQuestion); navigation.append(previous,next); }
    function nextQuestion() { if (state.index === state.order.length - 1) showResults(); else { state.index++; renderQuestion(); } }
    function showResults() { quiz.classList.add('hidden'); results.classList.remove('hidden'); const percent = Math.round(state.score / state.order.length * 100); const elapsed = Math.round((Date.now() - state.started) / 1000); results.innerHTML = `<svg class="trophy" viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M17 7h30v9h8v8c0 10-7 16-16 17v8h9v8H16v-8h9v-8C16 40 9 34 9 24v-8h8V7Zm-1 15c0 5 3 8 9 10V22h-9Zm23 10c6-2 9-5 9-10h-9v10Z"/></svg><p class="eyebrow">סיימת!</p><h2>${escapeHtml(nameInput.value.trim())}</h2><p>השלמת את שאלון המבוא למדעי המחשב.</p><div class="score${percent >= PASS ? '' : ' fail'}">${percent}</div><p><strong>${state.score}</strong> תשובות נכונות מתוך ${state.order.length} · ${elapsed} שניות</p><div class="submit-note"><strong>להגשה:</strong> צלמו צילום מסך של דף הסיכום הזה והגישו אותו במשימה שבקורס ב-<bdi class="nowrap">Google Classroom</bdi>.</div><button class="reset" id="reset">התחל מחדש</button>`; document.querySelector('#fill').style.width = '100%'; document.querySelector('#reset').addEventListener('click', () => location.reload()); if (percent >= PASS) launchConfetti(); }
    function launchConfetti() { const box = document.querySelector('#confetti'); box.classList.remove('hidden'); for (let index=0; index<70; index++) { const piece=document.createElement('span'); piece.style.left=`${Math.random()*100}%`; piece.style.animationDelay=`${Math.random()*.7}s`; piece.style.background=['#ff6b5e','#d7f205','#1267d6','#00b8a9'][index%4]; box.append(piece); } }
    function questionIcon(type) { return type === 'code' ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 4l-4 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : type === 'classify' ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7v7H4zM13 5h7v7h-7zM4 14h7v5H4zM13 14h7v5h-7z" fill="none" stroke="currentColor" stroke-width="2"/></svg>' : '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 12 2.5 2.5L16 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
    function formatCode(value) { return value.split('\n').map((line,index) => `<span class="code-line"><span class="line-number">${index + 1}</span><span>${escapeHtml(line) || '&nbsp;'}</span></span>`).join(''); }
    function escapeHtml(value) { const node = document.createElement('div'); node.textContent = value; return node.innerHTML; }
  </script>

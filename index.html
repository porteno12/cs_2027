<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1020">
<title>שאלוני מדעי המחשב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1020;--bg2:#151834;--raised:#1B1F3D;--ink:#F2F3FF;--dim:#9BA0CC;
--violet:#7B5CFF;--cyan:#22D3EE;--lime:#B8F02B;--pink:#FF4D8D;--rule:rgba(155,160,204,.2)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);direction:rtl;line-height:1.6;
font-family:Heebo,system-ui,sans-serif;padding-block:48px;padding-inline:16px}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
background:radial-gradient(38rem 30rem at 15% 10%,rgba(123,92,255,.35),transparent 62%),
radial-gradient(34rem 28rem at 88% 6%,rgba(34,211,238,.24),transparent 60%)}
.wrap{width:min(860px,100%);margin-inline:auto}
.brand{font:700 13px 'JetBrains Mono',monospace;direction:ltr;letter-spacing:.1em;
background:linear-gradient(90deg,var(--cyan),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(32px,7vw,56px);font-weight:900;letter-spacing:-.03em;margin:14px 0 8px;text-wrap:balance}
.sub{color:var(--dim);margin:0 0 36px;font-size:16px}
.grid{display:grid;gap:14px}
.lesson{position:relative;display:block;padding:26px;text-decoration:none;color:inherit;overflow:hidden;
background:linear-gradient(160deg,var(--raised),var(--bg2));border:1px solid var(--rule);border-radius:16px;
box-shadow:0 14px 40px rgba(0,0,0,.4);transition:transform .25s cubic-bezier(.34,1.3,.5,1),border-color .25s,box-shadow .25s}
.lesson::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;
background:linear-gradient(90deg,var(--violet),var(--cyan),var(--lime),var(--pink))}
.lesson:hover{transform:translateY(-3px);border-color:rgba(34,211,238,.5);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.lesson:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.tag{font:800 11.5px Heebo,sans-serif;letter-spacing:.09em;color:var(--cyan)}
.lesson h2{margin:8px 0 6px;font-size:clamp(22px,4vw,28px);font-weight:900;letter-spacing:-.02em}
.lesson p{margin:0;color:var(--dim);font-size:14.5px}
.arrow{position:absolute;inset-inline-start:24px;top:50%;transform:translateY(-50%);color:var(--lime);font-size:22px;opacity:0;transition:opacity .25s,transform .25s}
.lesson:hover .arrow{opacity:1;transform:translateY(-50%) translateX(-4px)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">CS / QUIZZES</div>
  <h1>שאלוני מדעי המחשב</h1>
  <p class="sub">רוני רובן · תשפ&quot;ז</p>
  <div class="grid">
    <a class="lesson" href="computer-science-intro/">
      <span class="arrow">&#8592;</span>
      <div class="tag">מדעי המחשב</div>
      <h2>מבוא למדעי המחשב</h2>
      <p>חומרה, תוכנה, אלגוריתמים ומבנה תוכנית</p>
    </a>
  </div>
</main>
</body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1020">
<title>משתנים וטיפוסי נתונים — שאלון סיכום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1020;--bg2:#151834;--raised:#1B1F3D;--raised2:#232850;--ink:#F2F3FF;--dim:#9BA0CC;
--violet:#7B5CFF;--cyan:#22D3EE;--pink:#FF4D8D;--lime:#B8F02B;--sage:#34D399;--clay:#FB7185;--amber:#FBBF24;
--rule:rgba(155,160,204,.2);--r:14px;--rc:10px;
--ease:cubic-bezier(.34,1.3,.5,1);--eo:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);direction:rtl;line-height:1.6;font-family:Heebo,system-ui,sans-serif;
background:var(--bg);padding-block:32px;padding-inline:16px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;
background:radial-gradient(38rem 30rem at 15% 12%,rgba(123,92,255,.42),transparent 62%),
radial-gradient(34rem 28rem at 88% 8%,rgba(34,211,238,.30),transparent 60%),
radial-gradient(30rem 26rem at 70% 92%,rgba(255,77,141,.26),transparent 62%);
animation:drift 22s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
background-image:linear-gradient(rgba(155,160,204,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(155,160,204,.07) 1px,transparent 1px);
background-size:38px 38px;mask-image:linear-gradient(to bottom,#000,transparent 92%)}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(2%,-2%,0) scale(1.07)}100%{transform:translate3d(-2%,1.5%,0) scale(1.03)}}
.shell{width:min(700px,100%);margin-inline:auto;display:flex;flex-direction:column;gap:24px}
.card{position:relative;background:linear-gradient(160deg,var(--raised),var(--bg2));border:1px solid var(--rule);
border-radius:var(--r);padding:clamp(20px,5vw,34px);overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:rise .4s var(--ease) both}
.card::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;
background:linear-gradient(90deg,var(--violet),var(--cyan),var(--lime),var(--pink));background-size:300% 100%;animation:slide 9s linear infinite}
@keyframes slide{to{background-position:300% 0}}
.eyebrow{font:800 12px/1 Heebo,sans-serif;letter-spacing:.1em;margin:0 0 12px;
background:linear-gradient(90deg,var(--cyan),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(28px,6.5vw,44px);line-height:1.06;letter-spacing:-.03em;margin:0 0 10px;font-weight:900;text-wrap:balance}
.meta{margin:0;color:var(--dim);font-weight:500;font-size:15px}
.meta b{color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;direction:ltr}
.chip{padding:5px 11px;border-radius:99px;font:700 11.5px 'JetBrains Mono',monospace;border:1px solid;animation:pulse 3.4s var(--eo) infinite}
.chip:nth-child(1){color:var(--violet);border-color:rgba(123,92,255,.45);background:rgba(123,92,255,.14)}
.chip:nth-child(2){color:var(--cyan);border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.13);animation-delay:.4s}
.chip:nth-child(3){color:var(--lime);border-color:rgba(184,240,43,.45);background:rgba(184,240,43,.13);animation-delay:.8s}
@keyframes pulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
label{display:block;margin:26px 0 8px;font-weight:700}
input[type=text]{width:100%;padding:14px 16px;border:2px solid var(--rule);border-radius:var(--rc);
color:var(--ink);background:rgba(9,11,24,.7);font:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
input[type=text]::placeholder{color:#5A6086}
input[type=text]:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.2)}
.btn{font:800 15px Heebo,sans-serif;border-radius:var(--rc);padding:13px 28px;min-height:48px;cursor:pointer;
border:1px solid transparent;transition:transform .22s var(--ease),box-shadow .22s var(--eo),opacity .2s}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.primary{color:#0E1020;background:linear-gradient(120deg,var(--lime),var(--cyan));box-shadow:0 6px 22px rgba(184,240,43,.3)}
.primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 30px rgba(184,240,43,.42)}
.primary:active:not(:disabled){transform:translateY(0)}
.primary:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
.ghost{background:transparent;color:var(--dim);border-color:var(--rule)}
.ghost:hover:not(:disabled){color:var(--ink);border-color:var(--cyan)}
.ghost:disabled{opacity:.28;cursor:not-allowed}
.start{margin-top:20px}
.bar-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:700 13px Heebo,sans-serif;color:var(--dim)}
.bar-row .n{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;color:var(--lime)}
.track{height:6px;border-radius:99px;background:rgba(155,160,204,.16);overflow:hidden;margin-top:10px}
.fill{height:100%;border-radius:99px;transition:width .5s var(--ease);background:linear-gradient(90deg,var(--violet),var(--cyan),var(--lime));
background-size:200% 100%;animation:slide 4s linear infinite;box-shadow:0 0 14px rgba(34,211,238,.55)}
.kind{display:inline-block;margin-bottom:11px;padding:4px 12px;border-radius:99px;font:800 11.5px Heebo,sans-serif;letter-spacing:.04em;border:1px solid}
.k-out{color:var(--cyan);border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.13)}
.k-err{color:var(--pink);border-color:rgba(255,77,141,.45);background:rgba(255,77,141,.13)}
.k-fix{color:var(--sage);border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.14)}
.k-eq{color:#38BDF8;border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.14)}
.k-cf{color:#C084FC;border-color:rgba(192,132,252,.5);background:rgba(192,132,252,.15)}
.k-why{color:#FB923C;border-color:rgba(251,146,60,.5);background:rgba(251,146,60,.14)}
.k-tf{color:var(--violet);border-color:rgba(123,92,255,.5);background:rgba(123,92,255,.16)}
.k-cls{color:var(--amber);border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.13)}
.k-cmp{color:#FBBF24;border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.14)}
.want{display:inline-block;margin:0 0 16px;padding:9px 15px;border-radius:var(--rc);direction:ltr;
font:700 13.5px 'JetBrains Mono',monospace;color:var(--amber);background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4)}
.want-lbl{display:block;direction:rtl;font:800 11px Heebo,sans-serif;color:var(--dim);margin-bottom:5px}
.k-open{color:#F472B6;border-color:rgba(244,114,182,.5);background:rgba(244,114,182,.15)}
.qtext{font-size:clamp(17px,3.6vw,20px);font-weight:700;line-height:1.45;margin:0 0 18px;text-wrap:balance}
pre{margin:0 0 20px;padding:15px 17px;border-radius:var(--rc);overflow-x:auto;background:#090B18;
border:1px solid rgba(123,92,255,.3);direction:ltr;text-align:left;font:500 13px/1.75 'JetBrains Mono',monospace;color:#DDE3FF;
box-shadow:inset 0 0 40px rgba(123,92,255,.12)}
.cl{display:grid;grid-template-columns:2em max-content;gap:16px;min-width:max-content}
.ln{color:#4E5486;text-align:right;user-select:none}
.choices{display:grid;gap:9px}
.choice{position:relative;width:100%;text-align:right;font:600 15px/1.5 Heebo,sans-serif;color:var(--ink);
background:var(--raised2);border:1px solid var(--rule);border-radius:var(--rc);padding:14px 16px;padding-inline-start:46px;cursor:pointer;
transition:border-color .22s var(--eo),background .22s var(--eo),transform .22s var(--ease),box-shadow .22s var(--eo)}
.choice::before{content:"";position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);
width:17px;height:17px;border-radius:50%;border:2px solid var(--dim);transition:all .22s var(--ease)}
.choice:hover:not(:disabled){border-color:var(--cyan);background:rgba(34,211,238,.12);transform:translateX(-4px);box-shadow:-4px 0 0 0 var(--cyan)}
.choice:hover:not(:disabled)::before{border-color:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.choice:active:not(:disabled){transform:translateX(-2px) scale(.995)}
.choice:disabled{cursor:default}
.choice:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.choice.mono{font-family:'JetBrains Mono',monospace;font-weight:500;direction:ltr;text-align:left;padding-inline:46px 16px}
.choice.mono bdi{display:block;direction:ltr;unicode-bidi:isolate}
.choice.ok{border-color:var(--sage);background:rgba(52,211,153,.17);animation:pop .42s var(--ease)}
.choice.ok::before{border-color:var(--sage);background:var(--sage);box-shadow:0 0 14px var(--sage)}
.choice.no{border-color:var(--clay);background:rgba(251,113,133,.15);animation:shake .4s var(--eo)}
.choice.no::before{border-color:var(--clay);background:var(--clay)}
.choice.ok::after,.choice.no::after{position:absolute;inset-inline-start:20px;top:50%;transform:translateY(-50%);font:900 11px Heebo,sans-serif;color:#0E1020}
.choice.ok::after{content:"\2713"}.choice.no::after{content:"\2715"}
.match-list{display:grid;gap:9px;margin-bottom:16px}
.match{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:12px 15px;
background:var(--raised2);border:1px solid var(--rule);border-radius:var(--rc)}
.match code{direction:ltr;text-align:left;font:500 13px 'JetBrains Mono',monospace;color:#DDE3FF}
select{padding:9px 12px;border:1px solid var(--rule);border-radius:8px;color:var(--ink);background:#090B18;font:inherit;cursor:pointer}
select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.match.ok{border-color:var(--sage);background:rgba(52,211,153,.12)}
.match.no{border-color:var(--clay);background:rgba(251,113,133,.12)}
.check{border:1px solid var(--cyan);color:var(--cyan);background:transparent}
.check:hover:not(:disabled){background:rgba(34,211,238,.14)}
.fb{margin-top:18px;padding:15px 17px;border-radius:var(--rc);font-size:15px;line-height:1.62;
background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.36);border-inline-start:4px solid var(--sage);animation:rise .34s var(--ease)}
.fb.bad{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.36);border-inline-start-color:var(--clay)}
.fb b{display:block;margin-bottom:4px;color:var(--sage)}.fb.bad b{color:var(--clay)}
.foot{display:flex;justify-content:space-between;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}
.opennote{padding:12px 15px;border-radius:var(--rc);background:rgba(244,114,182,.1);border:1px solid rgba(244,114,182,.35);
font-size:13.5px;color:#F9A8D4;margin:0 0 14px}
.ide{border:1px solid rgba(244,114,182,.4);border-radius:var(--rc);overflow:hidden;background:#090B18;margin-bottom:8px}
.ide-bar{display:flex;align-items:center;gap:7px;padding:9px 13px;background:rgba(244,114,182,.1);border-bottom:1px solid rgba(244,114,182,.25)}
.dot{width:10px;height:10px;border-radius:50%}
.ide-name{margin-inline-start:auto;font:700 11.5px 'JetBrains Mono',monospace;color:#F9A8D4;direction:ltr}
.ide-body{display:flex;direction:ltr}
.gutter{flex:none;padding:13px 10px 13px 13px;text-align:right;user-select:none;
font:500 13px/1.7 'JetBrains Mono',monospace;color:#4E5486;background:rgba(0,0,0,.25)}
textarea{flex:1;min-height:210px;padding:13px;border:0;outline:none;resize:vertical;
background:transparent;color:#DDE3FF;font:500 13px/1.7 'JetBrains Mono',monospace;direction:ltr;text-align:left;white-space:pre;overflow-wrap:normal;overflow-x:auto}
.result{text-align:center}
.who{font-size:clamp(22px,4.6vw,30px);font-weight:900;letter-spacing:-.02em;margin:0 0 4px}
.ring{width:136px;height:136px;margin:22px auto 16px;display:grid;place-items:center;border-radius:50%;
font:900 40px 'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;color:var(--ink);
border:6px solid var(--sage);box-shadow:0 0 0 8px rgba(52,211,153,.1),0 0 44px rgba(52,211,153,.4);animation:pop .6s var(--ease)}
.ring.fail{border-color:var(--clay);box-shadow:0 0 0 8px rgba(251,113,133,.1),0 0 44px rgba(251,113,133,.36)}
.sent-note{margin:20px auto 0;padding:11px 16px;border-radius:99px;display:inline-block;
font:700 13px Heebo,sans-serif;color:var(--sage);background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti span{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall 2.9s linear forwards}
.hidden{display:none!important}
.nowrap{white-space:nowrap}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translateX(5px)}40%{transform:translateX(-5px)}60%{transform:translateX(3px)}80%{transform:translateX(-2px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(560deg)}}
@media (max-width:600px){.foot{gap:10px}.btn{flex:1;padding:13px 16px}.ring{width:116px;height:116px;font-size:32px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<main class="shell">
  <section id="cover" class="card">
    <p class="eyebrow">מדעי המחשב</p>
    <h1>משתנים וטיפוסי נתונים</h1>
    <p class="meta"><b>רוני רובן</b> · ספטמבר 2026 · תשפ&quot;ז</p>
    <div class="chips"><span class="chip">declare</span><span class="chip">assign</span><span class="chip">scope</span></div>
    <label for="studentName">שם התלמיד/ה</label>
    <input type="text" id="studentName" autocomplete="name" placeholder="הקלידו את שמכם">
    <button id="start" class="btn primary start" disabled>התחל</button>
  </section>

  <section id="quiz" class="card hidden" aria-live="polite">
    <div class="bar-row"><span id="count"></span><span class="n" id="points"></span></div>
    <div class="track"><div id="fill" class="fill" style="width:0"></div></div>
    <div id="slot" style="margin-top:24px"></div>
    <div class="foot">
      <button class="btn ghost" id="prev">הקודמת</button>
      <button class="btn primary" id="next" disabled>הבאה</button>
    </div>
  </section>

  <section id="results" class="card result hidden"></section>
</main>
<div id="confetti" class="confetti hidden"></div>
<script>
const QUESTIONS = [{"kind": "out", "q": "מה יודפס כאשר נריץ את התוכנית?", "code": "int a = 3, b = 9;\na = b;\nb = a;\nSystem.out.println(\"a=\" + a + \" b=\" + b);", "choices": ["a=9 b=9", "a=9 b=3", "a=3 b=9", "a=3 b=3"], "answer": 0, "mono": true, "why": "בשורה 2 הערך תשע נדרס לתוך המשתנה הראשון, והערך שלוש נעלם מן הזיכרון לחלוטין. לכן בשורה 3 המשתנה הראשון כבר מחזיק תשע, וזה הערך שמועתק בחזרה. מי שענה תשע ושלוש הניח ששתי ההוראות מבצעות החלפה, אך כדי להחליף דרוש משתנה שלישי ששומר את הערך הישן לפני שהוא נדרס."}, {"kind": "err", "q": "מה יקרה כאשר ננסה להריץ את התוכנית?", "code": "int g = 6;\nint h;\nh = h + g;\nh = 2;\nSystem.out.println(\"h=\" + h);", "choices": ["תתקבל שגיאה והתוכנית לא תרוץ, כי בשורה 3 נקרא ערך ממשתנה שטרם נשמר בו ערך", "התוכנית תרוץ ותדפיס שתיים, כי שורה 4 קובעת את הערך הסופי", "התוכנית תרוץ ותדפיס שש", "תתקבל שגיאה והתוכנית לא תרוץ, כי בשורה 2 המשתנה מוצהר בלי ערך"], "answer": 0, "why": "שורה 3 נותנת ערך למשתנה, אך היא גם קוראת ממנו ערך בצד ימין, וקריאה כזאת ממשתנה שטרם נשמר בו ערך אינה מותרת. שורה 4 אמנם שומרת בו שתיים, אך היא מאוחרת מדי ואינה מצילה את שורה 3 שקדמה לה. שורה 2 עצמה חוקית לגמרי, שכן מותר להצהיר בלי לתת ערך."}, {"kind": "cmp", "q": "איזו הוראה יש לכתוב במקום הקו כדי ששני המשתנים יחליפו ביניהם ערכים?", "code": "int m = 3, n = 8, temp;\ntemp = m;\nm = n;\n_____\nSystem.out.println(\"m=\" + m + \" n=\" + n);", "choices": ["n = temp;", "n = m;", "temp = n;", "m = temp;"], "answer": 0, "mono": true, "why": "בשורה 3 הערך שמונה נכתב אל המשתנה הראשון ודורס שם את שלוש, ולכן הערך שלוש קיים כעת רק במשתנה העזר. ההוראה הנכונה מחזירה אותו מן העזר אל המשתנה השני ומשלימה את ההחלפה. מי שבחר בהוראה הנותנת לשני את ערכו של הראשון קיבל שמונה בשני המשתנים, משום שהערך שלוש נשאר תקוע בעזר."}, {"kind": "eq", "q": "האם שתי התוכניות מדפיסות אותו דבר?", "code": "// תוכנית א\nint a = 1, b = 2;\na++;\nb = b + a;\nSystem.out.println(\"b=\" + b);\n\n// תוכנית ב\nint a = 1, b = 2;\nb = b + a;\na++;\nSystem.out.println(\"b=\" + b);", "choices": ["לא — הראשונה מד unt"], "answer": 0, "mono": true, "why": "בשורה 2 נשמר הערך חמש בצד, ושתי ההעלאות שאחריה אינן מגיעות אליו, ולכן רק הוא מחזיק את הערך הישן ברגע החישוב. חיסור המשתנה מעצמו ייתן תמיד אפס, שכן באותו רגע שני הצדדים מחזיקים שבע. מי שבחר בשבע כתב את הערך העדכני ולא את הישן."}, {"kind": "out", "q": "מה יודפס כאשר נריץ את התוכנית?", "code": "int c = 3;\nint d = c + 1;\nc = d;\nd--;\nc = c + d;\nSystem.out.println(\"c=\" + c + \" d=\" + d);", "choices": ["c=7 d=3", "c=8 d=4", "c=7 d=4", "c=6 d=3"], "answer": 0, "mono": true, "why": "בשורה 3 נדרס הערך שלוש ומוחלף בארבע, ולכן הערך המקורי נעלם ואינו משתתף עוד בחישוב. בשורה 4 המשתנה השני יורד לשלוש, וזה הערך שנכנס לחיבור שבשורה 5 ומביא לשבע. מי שענה שמונה וארבע חיבר את הערכים כפי שהיו לפני הירידה באחד, אך הירידה מתבצעת לפני החיבור."}, {"kind": "err", "q": "מה יקרה כאשר ננסה להריץ את התוכנית?", "code": "int a = 5;\nint b;\nSystem.out.println(\"b=\" + b);", "choices": ["תתקבל שגיאה והתוכנית לא תרוץ, כי בשורה 3 נקרא משתנה שלא קיבל ערך", "התוכנית תרוץ ותדפיס אפס", "תתקבל שגיאה והתוכנית לא תרוץ, כי בשורה 2 חסר סימן השמה", "התוכנית תרוץ ותדפיס שורה ריקה"], "answer": 0, "why": "שורה 2 חוקית לגמרי — מותר להצהיר על שם בלי לתת לו ערך, והיא לבדה לא תעצור דבר. השגיאה נולדת דווקא בשורה 3, ברגע שמנסים לקרוא ערך ממשתנה שמעולם לא נשמר בו ערך. מי שענה אפס הניח שהמשתנה מתחיל אוטומטית מאפס."}, {"kind": "eq", "q": "האם שתי שורות ההדפסה מציגות אותו דבר?", "code": "int u = 4, w = 5;\nu++;\nSystem.out.println(\"sum=\" + u + w);\nSystem.out.println(\"sum=\" + (u + w));", "choices": ["לא — הראשונה מציגה חמישים וחמש והשנייה עשר", "כן — שתיהן מציגות עשר", "לא — הראשונה מציגה ארבעים וחמש והשנייה תשע", "לא — הראשונה מציגה עשר והשנייה חמישים וחמש"], "answer": 0, "why": "בשורה 2 המשתנה הראשון עולה לחמש, ולכן בשורה 3 נצמדים לטקסט שני מספרים שכל אחד מהם חמש והתוצאה הנראית היא חמישים וחמש. בשורה 4 הסוגריים מאלצים לחשב תחילה את החיבור המספרי, ורק התוצאה עשר נצמדת לטקסט. מי שענה ארבעים וחמש שכח שההעלאה באחד מתבצעת לפני שתי ההדפסות."}, {"kind": "fix", "q": "מה יש להוסיף לתוכנית כדי ששני המשתנים יחזיקו עשרים בשורת ההדפסה?", "code": "int x = 10;\nint y = x;\nx = 20;\nSystem.out.println(\"x=\" + x + \" y=\" + y);", "choices": ["יש להוסיף לפני ההדפסה הוראה הנותנת לשני את ערכו של הראשון", "יש להוסיף סימן השמה כפול בשורה 2 כדי שהשני יתעדכן יחד עם הראשון", "אין צורך להוסיף דבר, השני מתעדכן לבד עם הראשון", "יש להחליף את סדר שורות 2 ו-3"], "answer": 0, "why": "בשורה 2 מועתק הערך שהיה בראשון באותו רגע, וזהו. השינוי בשורה 3 נוגע לראשון בלבד ואינו מגיע אל השני, ולכן השני נשאר עם עשר. הדרך היחידה לעדכן אותו היא הוראת השמה נוספת אחרי שורה 3. החלפת הסדר תיתן לשני עשרים אך תשאיר את הראשון על עשר."}, {"kind": "tf", "q": "מותר להצהיר על משתנה בלי לתת לו ערך, אך אסור להדפיס אותו לפני שניתן לו ערך.", "choices": ["נכון", "לא נכון"], "answer": 0, "why": "הצהרה לבדה רק מקצה מקום בזיכרון ואינה דורשת ערך, ולכן היא כשלעצמה חוקית לחלוטין. האיסור חל על הקריאה — ברגע שמנסים להדפיס משתנה כזה תתקבל שגיאה והתוכנית לא תרוץ."}, {"kind": "cls", "q": "סווגו כל שורה לקטגוריה הנכונה.", "cats": ["הצהרה", "השמה"], "items": [["int sum;", "הצהרה"], ["sum = 5;", "השמה"], ["int x = 2, y = 7;", "הצהרה"], ["count++;", "השמה"], ["temp = a;", "השמה"]], "why": "הצהרה היא כל שורה שבה מופיע שם הטיפוס ונוצר מקום חדש בזיכרון, גם כאשר לא ניתן בה ערך וגם כאשר נוצרים בה שני שמות יחד. הפריט הרביעי מטעה במיוחד משום שאין בו סימן השמה גלוי, ולמרות זאת הוא משנה את הערך ולכן הוא השמה."}];

const state = {i:0,score:0,order:[],answers:[],code:''};

function el(id){return document.getElementById(id)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

startBtn.addEventListener('click',startQuiz);

function startQuiz(){
  state.order = shuffle(QUESTIONS).map(q=>{
    const c = {...q};
    if(q.choices) c.layout = shuffle(q.choices.map((t,i)=>({t,ok:i===q.answer})));
    if(q.items) c.itemOrder = shuffle(q.items);
    return c;
  });
  state.order.push({kind:'open',q:OPEN.q,note:OPEN.note,isOpen:true});
  state.i=0;state.score=0;state.answers=[];
  cover.classList.add('hidden');quiz.classList.remove('hidden');
  render();
}
function total(){return state.order.length}
function scoredCount(){return state.order.filter(q=>!q.isOpen).length}

function render(){
  const q=state.order[state.i],a=state.answers[state.i];
  el('count').textContent=`שאלה ${state.i+1} מתוך ${total()}`;
  el('points').textContent=`${state.score} נכונות`;
  el('fill').style.width=`${state.answers.filter(x=>x!==undefined).length/total()*100}%`;

  if(q.want) body+=`<div class="want"><span class="want-lbl">הפלט הנדרש</span><bdi>${esc(q.want)}</bdi></div>`;
  if(q.code) body+=codeBlock(q.code);
  slot.innerHTML=`<div style="animation:rise .38s var(--ease) both"><span class="kind ${cls}">${label}</span>
    <p class="qtext">${esc(q.q)}</p>${body}<div id="area"></div></div>`;
  const area=el('area');
  if(q.isOpen) renderOpen(area,q);
  else if(q.kind==='cls') renderClassify(area,q,a);

  nav();
}
function codeBlock(src){
  let n=0;
  return '<pre><code>'+src.split('\n').map(l=>{
    const blank=l.trim()===''||l.trim().startsWith('//');
    if(!blank)n++;
    return `<span class="cl"><span class="ln">${blank?'':n}</span><span>${(esc(l)||'&nbsp;').replace('_____','<span style="display:inline-block;min-width:74px;padding:0 10px;border-radius:5px;background:rgba(251,191,36,.2);border-bottom:2px dashed var(--amber);color:var(--amber);text-align:center">?</span>')}</span></span>`;
  }).join('')+'</code></pre>';
}

  q.layout.forEach((c,pos)=>{
    const b=document.createElement('button');
    b.className='choice'+(q.mono?' mono':'');
    b.innerHTML=q.mono?`<bdi>${esc(c.t)}</bdi>`:esc(c.t);
    if(a!==undefined){b.disabled=true;if(c.ok)b.classList.add('ok');if(pos===a.pos&&!a.ok)b.classList.add('no')}
    else b.addEventListener('click',()=>pick(pos,c.ok,q));
    box.append(b);
  });
  area.append(box);
  if(a!==undefined) feedback(area,a.ok,q);
}
function pick(pos,ok,q){
  const btns=[...slot.querySelectorAll('.choice')];
  btns.forEach((b,i)=>{b.disabled=true;if(q.layout[i].ok)b.classList.add('ok')});
  if(!ok)btns[pos].classList.add('no'); else state.score++;
  state.answers[state.i]={pos,ok};
  el('points').textContent=`${state.score} נכונות`;
  el('fill').style.width=`${state.answers.filter(x=>x!==undefined).length/total()*100}%`;
  feedback(el('area'),ok,q);nav();
}
function renderClassify(area,q,a){
  const list=document.createElement('div');list.className='match-list';
  q.itemOrder.forEach(([text,cat],i)=>{
    const row=document.createElement('div');row.className='match';
    row.innerHTML=`<code>${esc(text)}</code><select data-c="${esc(cat)}" aria-label="סיווג"><option value="">בחרו</option>${q.cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select>`;
    if(a!==undefined){const s=row.querySelector('select');s.value=a.sel[i];s.disabled=true;
      row.classList.add(a.sel[i]===cat?'ok':'no')}
    list.append(row);
  });
  area.append(list);
  if(a===undefined){
    const btn=document.createElement('button');btn.className='btn check';btn.textContent='בדיקה';
    btn.addEventListener('click',()=>{
      const sels=[...list.querySelectorAll('select')];
      if(sels.some(s=>!s.value))return;
      const ok=sels.every(s=>s.value===s.dataset.c);
      sels.forEach((s,i)=>{s.disabled=true;s.closest('.match').classList.add(s.value===s.dataset.c?'ok':'no')});
      state.answers[state.i]={ok,sel:sels.map(s=>s.value)};
      if(ok)state.score++;
      el('points').textContent=`${state.score} נכונות`;
      el('fill').style.width=`${state.answers.filter(x=>x!==undefined).length/total()*100}%`;
      btn.remove();feedback(area,ok,q);nav();
    });
    area.append(btn);
  } else feedback(area,a.ok,q);
}
function renderOpen(area,q){
  const wrap=document.createElement('div');
  wrap.innerHTML=`<div class="opennote">${esc(q.note)}</div>
    <div class="ide"><div class="ide-bar">
      <span class="dot" style="background:#FB7185"></span><span class="dot" style="background:#FBBF24"></span><span class="dot" style="background:#34D399"></span>
      <span class="ide-name">Main.java</span></div>
      <div class="ide-body"><div class="gutter" id="gutter">1</div><textarea id="codebox" spellcheck="false" aria-label="כתיבת קוד"></textarea></div></div>`;
  area.append(wrap);
  const ta=el('codebox'),gut=el('gutter');
  ta.value=state.code;
  const sync=()=>{const n=ta.value.split('\n').length;gut.textContent=Array.from({length:Math.max(n,12)},(_,i)=>i+1).join('\n');state.code=ta.value};
  ta.addEventListener('input',sync);
  ta.addEventListener('scroll',()=>gut.style.transform=`translateY(${-ta.scrollTop}px)`);
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart,en=ta.selectionEnd;
      ta.value=ta.value.slice(0,s)+'    '+ta.value.slice(en);ta.selectionStart=ta.selectionEnd=s+4;sync()}
  });
  sync();
  if(state.answers[state.i]===undefined) state.answers[state.i]={ok:null};
  el('fill').style.width=`${state.answers.filter(x=>x!==undefined).length/total()*100}%`;
}
function feedback(area,ok,q){
  if(!q.why)return;
  const d=document.createElement('div');d.className='fb'+(ok?'':' bad');
  d.innerHTML=`<b>${ok?'נכון!':'לא בדיוק.'}</b><span>${esc(q.why)}</span>`;
  area.append(d);
}
function nav(){
  prevBtn.disabled=state.i===0;
  nextBtn.disabled=state.answers[state.i]===undefined;
  nextBtn.textContent=state.i===total()-1?'סיום':'הבאה';
}
prevBtn.addEventListener('click',()=>{if(state.i>0){state.i--;render()}});
nextBtn.addEventListener('click',()=>{if(state.i===total()-1)finish();else{state.i++;render()}});

function finish(){
  quiz.classList.add('hidden');results.classList.remove('hidden');
  const n=scoredCount(),pct=Math.round(state.score/n*100);
  const wrong=[];
  state.order.forEach((q,i)=>{if(!q.isOpen&&state.answers[i]&&!state.answers[i].ok)wrong.push({n:i+1,text:q.q})});
  results.innerHTML=`<p class="eyebrow">סיכום</p><p class="who">${esc(nameInput.value.trim())}</p>
    <div class="ring${pct>=PASS?'':' fail'}">${pct}</div>
    <p class="meta"><b>${state.score}</b> תשובות נכונות מתוך ${n}</p>
    <div id="sent"></div>
    <div style="margin-top:26px"><button class="btn ghost" id="again">התחל מחדש</button></div>`;
  el('fill').style.width='100%';
  el('again').addEventListener('click',()=>location.reload());
  if(pct>=PASS)confetti();
  send({name:nameInput.value.trim(),subject:'cs',lesson:'variables',score:`${state.score}/${n}`,percent:pct,wrong,code:state.code});
}
function send(payload){
  const box=el('sent');
  try{
    fetch(ENDPOINT,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});
    box.innerHTML='<span class="sent-note">✓ נשלח למורה</span>';
  }catch(e){box.innerHTML='<span class="sent-note">✓ נשלח למורה</span>'}
}
function confetti(){
  const box=el('confetti');box.classList.remove('hidden');
  const colors=['#7B5CFF','#22D3EE','#B8F02B','#FF4D8D','#34D399'];
  for(let i=0;i<46;i++){const s=document.createElement('span');
    s.style.left=`${Math.random()*100}%`;s.style.animationDelay=`${Math.random()*.8}s`;
    s.style.background=colors[i%colors.length];box.append(s)}
}
</script>
</body>
</html>
